<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phoda 40+</title>
<meta name="description" content="App Treino Phoda 40+: treinos da semana e objetivo atual.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1E26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phoda 40+">
<style>
/* Cores: mar fundo, areia como tinta, céu só para “agora”.
   Verde, amarelo e vermelho aparecem apenas na leitura do joelho. */
:root{
  color-scheme:dark;
  --mar:#0E1E26;
  --mare:#16313C;
  --areia:#EADFC8;
  --areia-2:#A69C87;
  --linha:rgba(234,223,200,.15);
  --linha-forte:rgba(234,223,200,.34);
  --toque:rgba(234,223,200,.07);
  --ceu:#8FD3FF;
  --verde:#37C77F;
  --amarelo:#F3C544;
  --vermelho:#EE5B4F;
  --min:20px;            /* a régua: 1 minuto = 20 px */
  --lombada:24px;
  --trilho:42px;
  --tab-h:58px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --f-num:"Big Shoulders","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-txt:"Libre Franklin",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--mar);-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:var(--sat)}
body{
  margin:0;min-height:100dvh;background:var(--mar);color:var(--areia);
  font:400 16px/1.45 var(--f-txt);-webkit-font-smoothing:antialiased;
  padding-top:var(--sat);overscroll-behavior-y:none;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:20;
  background:rgba(14,30,38,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
html.travado,html.travado body{overflow:hidden}
h1,h2,h3,p,ol,ul,dl,dd{margin:0;padding:0}
ol,ul{list-style:none}
button{
  font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ceu);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-optical-sizing:auto}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

#app{max-width:520px;margin:0 auto;padding:0 16px calc(var(--tab-h) + var(--sab) + 36px)}

/* Cabeçalho e semana */
.topo{padding-top:14px}
.linha-data{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;color:var(--areia-2)}
.linha-data .hoje{color:var(--ceu);font-weight:600}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.dia{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  height:66px;border-radius:14px;
}
.dia .dow{font-size:12px;line-height:1;color:var(--areia-2)}
.dia .cod{font:700 26px/1 var(--f-num)}
.dia.folga .cod{font-weight:400;color:var(--areia-2)}
.dia:active{background:var(--toque)}
.dia[aria-pressed="true"]{background:var(--areia);color:var(--mar)}
.dia[aria-pressed="true"] .dow,.dia[aria-pressed="true"].folga .cod{color:rgba(14,30,38,.66)}
.dia.e-hoje::after{
  content:"";position:absolute;left:50%;bottom:-9px;width:6px;height:6px;margin-left:-3px;
  border-radius:50%;background:var(--ceu);
}

/* Título do treino */
.cab{display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:12px;margin-top:34px}
.cab h1{font:800 62px/.88 var(--f-num)}
.cab .total{font:300 62px/.88 var(--f-num);white-space:nowrap}
.cab .total small{font:500 15px/1 var(--f-txt);color:var(--areia-2);margin-left:5px}
.sub{margin-top:12px;font-size:18px;font-weight:600;line-height:1.3}
.contexto{margin-top:4px;font-size:14.5px;color:var(--areia-2)}

/* A régua de minutos */
.regua{margin-top:22px}
.bloco{display:grid;grid-template-columns:var(--lombada) 1fr}
.lombada{
  border-top:1px solid var(--mar);
  background:repeating-linear-gradient(135deg,var(--linha) 0 1px,transparent 1px 7px);
  box-shadow:inset 0 0 0 1px var(--linha);color:var(--areia-2);
}
.bloco.nucleo .lombada{background:var(--areia);box-shadow:none;color:var(--mar)}
.lombada span{
  position:sticky;top:calc(var(--sat) + 8px);
  display:block;width:var(--lombada);padding:9px 0;
  writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:11.5px;font-weight:700;line-height:var(--lombada);letter-spacing:.02em;white-space:nowrap;text-align:end;
}
.bloco:not(.nucleo) .lombada span{background:var(--mar);box-shadow:inset 1px 0 0 var(--linha),inset -1px 0 0 var(--linha)}
.item{
  position:relative;display:grid;grid-template-columns:var(--trilho) minmax(0,1fr) auto;column-gap:10px;align-content:start;
  width:100%;min-height:max(44px,calc(var(--m) * var(--min)));
  border-top:1px solid var(--linha-forte);
}
.item::before{
  content:"";position:absolute;left:0;top:-1px;bottom:0;width:8px;
  background:repeating-linear-gradient(to bottom,var(--linha-forte) 0 1px,transparent 1px var(--min));
}
.item:active{background:var(--toque)}
.item .t{justify-self:start;padding:9px 0 0 16px;font:600 17px/1 var(--f-num);color:var(--areia-2)}
.item .corpo{display:block;min-width:0;padding:8px 0}
.item .nome{display:block;font-size:17px;font-weight:600;line-height:1.24}
.item .dica{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--l);line-clamp:var(--l);overflow:hidden;
  margin-top:6px;font-size:13.5px;line-height:1.42;color:var(--areia-2);
}
.item .dose{padding:6px 2px 6px 0;text-align:right;font:700 30px/1 var(--f-num);white-space:nowrap}
.item .dose span{display:block}
.item .dose i{margin-left:4px;font:500 13px/1 var(--f-txt);color:var(--areia-2)}
.item .dose.varias{font-size:23px;line-height:1.06;padding-top:8px;padding-bottom:4px}
.item .dose.tres{font-size:21px;line-height:1.05}
.item .dose small{display:block;margin-top:4px;font:500 12px/1 var(--f-txt);color:var(--areia-2)}
.fim{
  display:grid;grid-template-columns:var(--lombada) var(--trilho) 1fr;column-gap:0;
  border-top:1px solid var(--linha-forte);color:var(--areia-2);font-size:14px;
}
.fim .t{justify-self:start;padding:9px 0 0 16px;font:600 17px/1 var(--f-num)}
.fim .txt{padding:8px 0 0 10px}
.toque{margin:22px 0 0 calc(var(--lombada) + var(--trilho) + 10px);font-size:13.5px;line-height:1.42;color:var(--areia-2)}

/* Quinta e descanso */
.avulso{margin-top:34px}
.avulso h1{font:800 62px/.88 var(--f-num)}
.avulso .hora{margin-top:34px;font:300 132px/.8 var(--f-num);letter-spacing:-.01em}
.avulso .hora small{display:block;margin-top:14px;font:500 15px/1.3 var(--f-txt);letter-spacing:0;color:var(--areia-2)}
.notas{margin-top:28px;border-bottom:1px solid var(--linha)}
.notas li{padding:14px 0;border-top:1px solid var(--linha);font-size:16px}
.proximo{
  display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:28px;padding:16px 18px;
  border-radius:16px;background:var(--areia);color:var(--mar);font-weight:600;
}
.proximo .num{font-size:30px;font-weight:800;line-height:1}
.proximo:active{opacity:.86}

/* Objetivo */
.agora{margin-top:22px}
.agora .rot{font-size:15px;font-weight:600;color:var(--ceu)}
.agora h1{margin-top:6px;font:800 52px/.92 var(--f-num)}
.agora h1 + h1{margin-top:8px}
.agora .resumo{margin-top:14px;font-size:16px;color:var(--areia-2)}
.tempo{position:relative;margin-top:34px}
.eixo{position:relative;height:36px;border-bottom:1px solid var(--linha-forte)}
.eixo .mes{position:absolute;bottom:6px;font-size:12px;line-height:1;color:var(--areia-2);transform:translateX(3px)}
.eixo .mes::before{content:"";position:absolute;left:-3px;bottom:-6px;width:1px;height:16px;background:var(--linha-forte)}
.eixo .ano{position:absolute;top:0;font:600 13px/1 var(--f-num);color:var(--areia-2);transform:translateX(3px)}
.eixo .aqui{position:absolute;top:0;font-size:12px;line-height:1;font-weight:600;color:var(--ceu);transform:translateX(-50%);white-space:nowrap}
.eixo .aqui.esq{transform:none}
.eixo .aqui.dir{transform:translateX(-100%)}
.fase{display:block;width:100%;padding:14px 0 15px;border-bottom:1px solid var(--linha)}
.fase:active{background:var(--toque)}
.fase .f-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fase .f-nome{font-size:17px;font-weight:600}
.fase .f-datas{font:600 17px/1 var(--f-num);color:var(--areia-2);white-space:nowrap}
.fase .trilha{position:relative;display:block;height:14px;margin-top:11px}
.fase .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--linha)}
.fase .barra{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--areia);overflow:hidden}
.fase.feito .barra{opacity:.42}
.fase.agora-f .barra{background:rgba(234,223,200,.2);box-shadow:inset 0 0 0 1px var(--areia)}
.fase.agora-f .cheio{position:absolute;left:0;top:0;bottom:0;background:var(--areia)}
.fase.futuro .barra{background:repeating-linear-gradient(135deg,var(--areia) 0 1.5px,transparent 1.5px 6px);box-shadow:inset 0 0 0 1px var(--linha-forte)}
.fase.aberta .barra{
  background:repeating-linear-gradient(135deg,var(--areia-2) 0 1px,transparent 1px 6px);
  -webkit-mask-image:linear-gradient(to right,#000,transparent);mask-image:linear-gradient(to right,#000,transparent);border-radius:3px 0 0 3px;
}
.fase .marco{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--mar)}
.fase .agulha{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ceu)}
.fase .f-estado{display:block;margin-top:10px;font-size:14px;color:var(--areia-2)}
.fase.agora-f .f-estado{color:var(--areia)}
.fase .f-crit{display:block;margin-top:4px;font-size:14px;line-height:1.42;color:var(--areia-2)}

.semaforo{margin-top:38px}
.semaforo h2{font-size:17px;font-weight:600}
.semaforo ol{margin-top:10px;border-bottom:1px solid var(--linha)}
.semaforo li{display:grid;grid-template-columns:12px 46px 1fr;column-gap:10px;align-items:baseline;padding:13px 0;border-top:1px solid var(--linha)}
.semaforo .luz{align-self:start;margin-top:6px;width:12px;height:12px;border-radius:50%}
.luz.verde{background:var(--verde)}.luz.amarelo{background:var(--amarelo)}.luz.vermelho{background:var(--vermelho)}
.semaforo .faixa{font:700 24px/1 var(--f-num)}
.semaforo .s-txt{font-size:14.5px;line-height:1.42;color:var(--areia-2)}
.semaforo .s-txt b{color:var(--areia);font-weight:600}

/* Barra inferior */
.abas{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(14,30,38,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--linha);padding-bottom:var(--sab);
}
.abas div{display:grid;grid-template-columns:1fr 1fr;max-width:520px;margin:0 auto;padding:0 16px}
.aba{display:flex;align-items:center;justify-content:center;gap:9px;height:var(--tab-h);font-size:15px;font-weight:600;color:var(--areia-2)}
.aba svg{width:22px;height:22px;flex:none}
.aba[aria-current="page"]{color:var(--areia)}
.aba:active{opacity:.7}

/* Folha de detalhe */
.fundo{position:fixed;inset:0;z-index:40;background:rgba(3,10,14,.62);opacity:0;transition:opacity .22s ease}
.fundo.on{opacity:1}
.folha{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;max-height:88dvh;overflow-y:auto;
  background:var(--mare);border-radius:24px 24px 0 0;padding:0 20px calc(var(--sab) + 30px);
  transform:translateY(103%);transition:transform .3s cubic-bezier(.2,.85,.25,1);
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.folha.on{transform:none}
.folha .pega{position:sticky;top:0;z-index:1;display:flex;justify-content:center;align-items:flex-start;height:30px;margin:0 -20px;background:var(--mare);border-radius:24px 24px 0 0;touch-action:none}
.folha .pega::before{content:"";width:40px;height:4px;margin-top:10px;border-radius:2px;background:var(--linha-forte)}
.folha .fechar{position:absolute;right:8px;top:8px;z-index:2;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--areia-2)}
.folha .fechar:active{background:var(--toque)}
.folha .fechar svg{width:18px;height:18px}
.folha h2{padding-right:40px;font:800 38px/.95 var(--f-num)}
.folha .onde{margin-top:8px;font-size:14.5px;color:var(--areia-2)}
.folha .unica{margin-top:20px;font:800 64px/.9 var(--f-num)}
.folha .unica i,.folha .doses dd i{margin-left:6px;font:500 15px/1 var(--f-txt);color:var(--areia-2)}
.folha .unica small{display:block;margin-top:8px;font:500 15px/1 var(--f-txt);color:var(--areia-2)}
.folha .doses{margin-top:18px;border-bottom:1px solid var(--linha)}
.folha .doses div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--linha)}
.folha .doses dt{font-size:16px}
.folha .doses dd{font:700 30px/1 var(--f-num);white-space:nowrap}
.folha .regra{margin-top:20px;padding:13px 15px;border-radius:14px;background:rgba(234,223,200,.09);font-size:15.5px;font-weight:500;line-height:1.4}
.folha h3{margin-top:24px;font-size:14px;font-weight:600;color:var(--areia-2)}
.folha h3 + p{margin-top:5px;font-size:16.5px;line-height:1.5}
.folha .corrido{margin-top:16px;font-size:16.5px;line-height:1.5}
.escada{margin-top:8px;border-bottom:1px solid var(--linha)}
.escada li{display:grid;grid-template-columns:26px 1fr;column-gap:8px;align-items:baseline;padding:12px 0;border-top:1px solid var(--linha)}
.escada .n{font:700 24px/1 var(--f-num);color:var(--areia-2)}
.escada .e-nome{display:block;font-size:16px;font-weight:500;line-height:1.3}
.escada .e-data{display:block;margin-top:3px;font-size:13.5px;color:var(--areia-2)}
.escada li.atual .n{color:var(--areia)}
.escada li.atual .e-data{color:var(--ceu);font-weight:600}
.miudo{margin-top:10px;font-size:13.5px;line-height:1.42;color:var(--areia-2)}

/* Aviso de versão nova */
.aviso{
  position:fixed;left:16px;right:16px;bottom:calc(var(--tab-h) + var(--sab) + 12px);z-index:35;max-width:488px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 10px 10px 16px;
  border-radius:16px;background:var(--mare);box-shadow:0 0 0 1px var(--linha-forte),0 10px 30px rgba(0,0,0,.4);font-size:15px;
}
.aviso button{padding:9px 14px;border-radius:11px;background:var(--areia);color:var(--mar);font-weight:600}

@media (prefers-reduced-motion:reduce){
  .fundo,.folha{transition:none}
}
@media (min-width:600px){
  .folha{border-radius:24px;bottom:24px}
}
</style>

    { nome: "Salto com aterrissagem travada em dois pés", previsto: "2026-12-07" },
    { nome: "Salto numa perna só, aterrissagem travada", previsto: "2026-12-14" },
    { nome: "Salto lateral de uma perna para a outra", previsto: "2026-12-21" }
  ],

  semaforo: {
    titulo: "Leitura do joelho, 24\u00A0h depois",
    faixas: [
      { cor: "verde", faixa: "0–3", nome: "Progredir", texto: "Dor tolerável e, na manhã seguinte, igual ou melhor. Aumente carga, amplitude ou volume." },
      { cor: "amarelo", faixa: "4–5", nome: "Manter", texto: "Dor presente, mas sob controle, e de volta ao normal em 24\u00A0h. Repita a mesma carga." },
      { cor: "vermelho", faixa: "6+", nome: "Recuar", texto: "Dor forte ou piora que passa de 24\u00A0h. Volte à carga da semana anterior." }
    ]
  },

  /* Linha do tempo. Fase sem datas ("aberta: true") aparece como “a definir”. */
  objetivos: [
    { id: "joelho", nome: "Recuperação do joelho", inicio: "2026-08-24", fim: "2026-11-15",
      resumo: "Carga lenta e progressiva até a dor sumir e a força voltar.",
      marcos: [ { data: "2026-10-13", texto: "Sem dor desde meados de outubro." } ] },
    { id: "futevolei", nome: "Iniciando no futevôlei", inicio: "2026-11-19", fim: "2027-01-31",
      resumo: "Quintas às 8:30, uma vez por semana. O joelho passou limpo na aula experimental.",
      criterio: "Seis quintas sem reação no joelho no dia seguinte. Aí decidimos se sobe para duas vezes por semana." },
    { id: "elasticidade", nome: "Elasticidade", inicio: "2026-11-23", fim: "2026-12-27", escada: true,
      resumo: "Saltos e aterrissagem às segundas, um degrau por semana.",
      criterio: "20 saltos submáximos e 30\u00A0s de deslocamento lateral sem dor, nem na hora nem 24\u00A0h depois." },
    { id: "tenis", nome: "Volta ao tênis", aberta: true,
      resumo: "Mais adiante em 2027. A definir." }
  ]
};
</script>
<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var maiuscula = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  /* “3 min” vira número grande com a unidade pequena ao lado. */
  var doseHTML = function (d) {
    var i = d.indexOf(' ');
    return i < 0 ? esc(d) : esc(d.slice(0, i)) + '<i>' + esc(d.slice(i + 1)) + '</i>';
  };

  var DOW = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var DOW_L = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  var MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var MES_L = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var ORDEM = [1, 2, 3, 4, 5, 6, 0];
  var DIA_MS = 864e5;

  var meiaNoite = function (d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  var dia = function (iso) { var p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var dif = function (a, b) { return Math.round((meiaNoite(a) - meiaNoite(b)) / DIA_MS); };
  var mais = function (d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); };
  var curta = function (d) { return d.getDate() + ' ' + MES[d.getMonth()]; };
  var longa = function (d) { return d.getDate() + ' de ' + MES_L[d.getMonth()]; };

  var estado = { aba: 'treino', hoje: meiaNoite(new Date()), dow: new Date().getDay() };
  var tela = $('#tela');

  /* ───────── Treino ───────── */

  function totalDe(t) {
    var b = t.blocos[t.blocos.length - 1];
    return b.slots[b.slots.length - 1].ate;
  }

  function rotuloDoDia(d) {
    var c = PLANO.semana[d];
    if (!c) return DOW_L[d] + ', descanso';
    if (c === 'FUT') return DOW_L[d] + ', futevôlei';
    return DOW_L[d] + ', treino ' + c;
  }

  function telaTreino() {
    var hojeDow = estado.hoje.getDay();
    var sel = estado.dow;
    var eHoje = sel === hojeDow;
    var cod = PLANO.semana[sel];

    var h = '<header class="topo"><p class="linha-data"><span>' +
      esc(maiuscula(eHoje ? DOW_L[sel] + ', ' + longa(estado.hoje) : DOW_L[sel])) + '</span>' +
      (eHoje ? '<span class="hoje">hoje</span>' : '') + '</p>' +
      '<div class="semana" role="group" aria-label="Dias da semana">';
    ORDEM.forEach(function (d) {
      var c = PLANO.semana[d];
      var texto = c ? (c === 'FUT' ? 'Fut' : c) : '·';
      h += '<button class="dia' + (c ? '' : ' folga') + (d === hojeDow ? ' e-hoje' : '') + '" data-dow="' + d +
        '" aria-pressed="' + (d === sel) + '" aria-label="' + esc(rotuloDoDia(d)) + (d === hojeDow ? ', hoje' : '') + '">' +
        '<span class="dow" aria-hidden="true">' + DOW[d] + '</span><span class="cod num" aria-hidden="true">' + texto + '</span></button>';
    });
    h += '</div></header>';

    if (!cod) h += telaDescanso(sel, eHoje);
    else if (cod === 'FUT') h += telaFutevolei();
    else h += telaRegua(PLANO.treinos[cod]);
    return h;
  }

  function telaRegua(t) {
    var total = totalDe(t);
    var h = '<section aria-label="Treino ' + esc(t.letra) + '">' +
      '<div class="cab"><h1>Treino ' + esc(t.letra) + '</h1>' +
      '<p class="total">' + total + '<small>min</small></p></div>' +
      '<p class="sub">' + esc(t.titulo) + '</p>' +
      (t.contexto ? '<p class="contexto">' + esc(t.contexto) + '</p>' : '') +
      '<ol class="regua">';
    t.blocos.forEach(function (b, bi) {
      h += '<li class="bloco' + (b.nucleo ? ' nucleo' : '') + '"><div class="lombada"><span>' + esc(b.nome) + '</span></div><ol>';
      b.slots.forEach(function (s, si) {
        var m = s.ate - s.de;
        var linhas = m >= 12 ? 4 : m >= 8 ? 3 : m >= 5 ? 2 : 0;
        h += '<li><button class="item" style="--m:' + m + '" data-treino="' + esc(t.letra) + '" data-b="' + bi + '" data-s="' + si + '" aria-haspopup="dialog">' +
          '<span class="t" aria-hidden="true">' + s.de + '</span>' +
          '<span class="corpo"><span class="nome">' + esc(s.nome) + '</span>' +
          (linhas && s.como ? '<span class="dica" style="--l:' + linhas + '">' + esc(s.como) + '</span>' : '') + '</span>' +
          '<span class="dose' + (s.dose.length > 1 ? ' varias' : '') + (s.dose.length > 2 ? ' tres' : '') + '">' +
          s.dose.map(function (d) { return '<span>' + doseHTML(d) + '</span>'; }).join('') +
          (s.nota ? '<small>' + esc(s.nota) + '</small>' : '') + '</span>' +
          '<span class="sr">, minutos ' + s.de + ' a ' + s.ate + '</span></button></li>';
      });
      h += '</ol></li>';
    });
    h += '</ol><p class="fim"><span></span><span class="t">' + total + '</span><span class="txt">fim</span></p>' +
      '<p class="toque">Toque em um exercício para ver como fazer e por quê.</p></section>';
    return h;
  }

  function telaFutevolei() {
    var f = PLANO.futevolei;
    return '<section class="avulso" aria-label="' + esc(f.titulo) + '"><h1 class="num">' + esc(f.titulo) + '</h1>' +
      '<p class="hora num">' + esc(f.hora) + '<small>' + esc(f.resumo) + '</small></p>' +
      '<ul class="notas">' + f.notas.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></section>' +
      semaforo();
  }

  function proximaSessao(d) {
    for (var i = 1; i <= 7; i++) {
      var k = (d + i) % 7;
      if (PLANO.semana[k]) return k;
    }
    return null;
  }

  function telaDescanso(sel, eHoje) {
    var k = proximaSessao(sel);
    var h = '<section class="avulso" aria-label="Descanso"><h1 class="num">Descanso</h1>' +
      '<p class="sub">' + (eHoje ? 'Hoje não tem treino.' : maiuscula(DOW_L[sel]) + ' não tem treino.') + '</p>' +
      '<p class="contexto">O tendão se adapta no intervalo entre as cargas. Dormir bem conta como treino.</p>';
    if (k !== null) {
      var c = PLANO.semana[k];
      h += '<button class="proximo" data-ir="' + k + '"><span>A seguir, ' + DOW_L[k] + '</span>' +
        '<span class="num">' + (c === 'FUT' ? esc(PLANO.futevolei.titulo) : 'Treino ' + esc(c)) + '</span></button>';
    }
    return h + '</section>';
  }

  /* ───────── Objetivo ───────── */

  function situacao(o) {
    if (o.aberta || !o.inicio) return { tipo: 'aberta', texto: 'A definir' };
    var ini = dia(o.inicio), fim = dia(o.fim), h = estado.hoje;
    if (h > fim) return { tipo: 'feito', texto: 'Concluído' };
    if (h < ini) {
      var n = dif(ini, h);
      return { tipo: 'futuro', texto: n === 1 ? 'Começa amanhã' : 'Começa em ' + n + ' dias, ' + DOW_L[ini.getDay()] };
    }
    var sem = Math.floor(dif(h, ini) / 7) + 1;
    var tot = Math.ceil((dif(fim, ini) + 1) / 7);
    return { tipo: 'agora-f', texto: 'Em curso, semana ' + sem + ' de ' + tot };
  }

  function janela() {
    var datas = [];
    PLANO.objetivos.forEach(function (o) { if (o.inicio) { datas.push(dia(o.inicio)); datas.push(dia(o.fim)); } });
    datas.push(estado.hoje);
    var min = new Date(Math.min.apply(null, datas)), max = new Date(Math.max.apply(null, datas));
    var temAberta = PLANO.objetivos.some(function (o) { return o.aberta; });
    var ini = new Date(min.getFullYear(), min.getMonth(), 1);
    var fim = new Date(max.getFullYear(), max.getMonth() + (temAberta ? 3 : 1), 1);
    return { ini: ini, fim: fim, dias: dif(fim, ini), max: max };
  }

  function telaObjetivo() {
    var j = janela();
    var pct = function (d) { return Math.max(0, Math.min(100, dif(d, j.ini) / j.dias * 100)); };
    var f2 = function (n) { return n.toFixed(2); };
    var hojePct = pct(estado.hoje);

    var emCurso = PLANO.objetivos.filter(function (o) { return situacao(o).tipo === 'agora-f'; });
    var futuras = PLANO.objetivos.filter(function (o) { return situacao(o).tipo === 'futuro'; });
    var h = '<section class="agora" aria-label="Fase atual">';
    if (emCurso.length) {
      h += '<p class="rot">Agora</p>' + emCurso.map(function (o) { return '<h1>' + esc(o.nome) + '</h1>'; }).join('') +
        '<p class="resumo">' + esc(emCurso[0].resumo) + '</p>';
    } else if (futuras.length) {
      h += '<p class="rot">A seguir</p><h1>' + esc(futuras[0].nome) + '</h1><p class="resumo">' + esc(futuras[0].resumo) + '</p>';
    } else {
      h += '<p class="rot">Agora</p><h1>Sem fase em curso</h1><p class="resumo">Defina a próxima fase no plano.</p>';
    }
    h += '</section>';

    var meses = [];
    for (var m = new Date(j.ini); m < j.fim; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) meses.push(m);

    h += '<section class="tempo" aria-label="Linha do tempo"><div class="eixo" aria-hidden="true">';
    meses.forEach(function (d, i) {
      var comAno = i === 0 || d.getMonth() === 0;
      h += '<span class="mes" style="left:' + f2(pct(d)) + '%">' + MES[d.getMonth()] + (comAno ? ' ' + String(d.getFullYear()).slice(2) : '') + '</span>';
    });
    h += '<span class="aqui' + (hojePct < 8 ? ' esq' : hojePct > 92 ? ' dir' : '') + '" style="left:' + f2(hojePct) + '%">hoje, ' + curta(estado.hoje) + '</span></div><ol>';

    PLANO.objetivos.forEach(function (o) {
      var s = situacao(o);
      var ini, fim, esq, larg, cheio = '';
      if (s.tipo === 'aberta') {
        esq = Math.min(92, pct(mais(j.max, 21))); larg = 100 - esq;
      } else {
        ini = dia(o.inicio); fim = dia(o.fim);
        esq = pct(ini); larg = Math.max(1.2, pct(mais(fim, 1)) - esq);
        if (s.tipo === 'agora-f') {
          var p = (dif(estado.hoje, ini) + 1) / (dif(fim, ini) + 1) * 100;
          cheio = '<span class="cheio" style="width:' + f2(p) + '%"></span>';
        }
      }
      var marcos = '';
      (o.marcos || []).forEach(function (mk) {
        var p = (dif(dia(mk.data), ini)) / (dif(fim, ini) + 1) * 100;
        marcos += '<span class="marco" style="left:' + f2(p) + '%"></span>';
      });
      h += '<li><button class="fase ' + s.tipo + '" data-fase="' + esc(o.id) + '" aria-haspopup="dialog">' +
        '<span class="f-cab"><span class="f-nome">' + esc(o.nome) + '</span><span class="f-datas">' +
        (s.tipo === 'aberta' ? '2027' : curta(ini) + ' – ' + curta(fim)) + '</span></span>' +
        '<span class="trilha" aria-hidden="true">' +
        meses.slice(1).map(function (d) { return '<span class="tick" style="left:' + f2(pct(d)) + '%"></span>'; }).join('') +
        '<span class="barra" style="left:' + f2(esq) + '%;width:' + f2(larg) + '%">' + cheio + marcos + '</span>' +
        '<span class="agulha" style="left:' + f2(hojePct) + '%"></span></span>' +
        '<span class="f-estado">' + esc(s.texto) + '</span>' +
        (s.tipo === 'agora-f' && o.criterio ? '<span class="f-crit">Para avançar: ' + esc(o.criterio) + '</span>' : '') +
        '</button></li>';
    });
    h += '</ol></section>' + semaforo();
    return h;
  }

  function semaforo() {
    var s = PLANO.semaforo;
    return '<section class="semaforo"><h2>' + esc(s.titulo) + '</h2><ol>' + s.faixas.map(function (f) {
      return '<li><span class="luz ' + esc(f.cor) + '" aria-hidden="true"></span><span class="faixa num">' + esc(f.faixa) + '</span>' +
        '<span class="s-txt"><b>' + esc(f.nome) + '.</b> ' + esc(f.texto) + '</span></li>';
    }).join('') + '</ol></section>';
  }

  /* ───────── Folha de detalhe ───────── */

  function escadaHTML() {
    var atual = -1;
    PLANO.escada.forEach(function (p, i) { if (estado.hoje >= dia(p.previsto)) atual = i; });
    return '<h3>Escada de saltos</h3><ol class="escada">' + PLANO.escada.map(function (p, i) {
      var d = dia(p.previsto);
      return '<li' + (i === atual ? ' class="atual"' : '') + '><span class="n num">' + (i + 1) + '</span><span>' +
        '<span class="e-nome">' + esc(p.nome) + '</span><span class="e-data">' +
        (i === atual ? 'Previsto para agora' : 'A partir de ' + longa(d)) + '</span></span></li>';
    }).join('') + '</ol><p class="miudo">As datas são previsão. Só sobe de degrau quem passou limpo no dia seguinte.</p>';
  }

  function folhaItem(t, s) {
    var h = '<h2 class="num" id="folha-titulo">' + esc(s.nome) + '</h2>' +
      '<p class="onde">Treino ' + esc(t.letra) + ', do minuto ' + s.de + ' ao ' + s.ate + '</p>';
    if (s.dose.length === 1) {
      h += '<p class="unica num">' + doseHTML(s.dose[0]) + (s.nota ? '<small>' + esc(s.nota) + '</small>' : '') + '</p>';
    } else {
      h += '<dl class="doses">' + s.dose.map(function (d, i) {
        return '<div><dt>' + esc((s.rotulos && s.rotulos[i]) || '') + '</dt><dd>' + doseHTML(d) + '</dd></div>';
      }).join('') + '</dl>';
    }
    if (s.regra) h += '<p class="regra">' + esc(s.regra) + '</p>';
    if (s.como) h += '<h3>Como fazer</h3><p>' + esc(s.como) + '</p>';
    if (s.escada) h += escadaHTML();
    if (s.porque) h += '<h3>Por quê</h3><p>' + esc(s.porque) + '</p>';
    return h;
  }

  function folhaFase(o) {
    var s = situacao(o);
    var h = '<h2 class="num" id="folha-titulo">' + esc(o.nome) + '</h2>';
    if (s.tipo === 'aberta') {
      h += '<p class="onde">Sem datas ainda.</p>';
    } else {
      var ini = dia(o.inicio), fim = dia(o.fim);
      var mesmoAno = ini.getFullYear() === fim.getFullYear();
      h += '<p class="onde">' + longa(ini) + (mesmoAno ? '' : ' de ' + ini.getFullYear()) + ' a ' + longa(fim) + ' de ' + fim.getFullYear() +
        '. ' + esc(s.texto) + '.</p>';
    }
    h += '<p class="corrido">' + esc(o.resumo) + '</p>';
    (o.marcos || []).forEach(function (mk) { h += '<p class="regra">' + esc(mk.texto) + '</p>'; });
    if (o.criterio) h += '<h3>Para avançar</h3><p>' + esc(o.criterio) + '</p>';
    if (o.escada) h += escadaHTML();
    return h;
  }

  var folha = $('.folha'), fundo = $('.fundo'), conteudo = $('.conteudo', folha);
  var ultimoFoco = null, relogioFechar = null;
  var semMovimento = function () { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; };

  function abrir(html) {
    clearTimeout(relogioFechar);
    conteudo.innerHTML = html;
    ultimoFoco = document.activeElement;
    folha.hidden = false; fundo.hidden = false;
    folha.style.transform = ''; folha.style.transition = '';
    folha.scrollTop = 0;
    document.documentElement.classList.add('travado');
    void folha.offsetHeight;
    folha.classList.add('on'); fundo.classList.add('on');
    try { folha.focus({ preventScroll: true }); } catch (_) { folha.focus(); }
  }

  function fechar() {
    if (folha.hidden) return;
    folha.style.transition = ''; folha.style.transform = '';
    folha.classList.remove('on'); fundo.classList.remove('on');
    document.documentElement.classList.remove('travado');
    var some = function () { folha.hidden = true; fundo.hidden = true; };
    clearTimeout(relogioFechar);
    if (semMovimento()) some(); else relogioFechar = setTimeout(some, 320);
    if (ultimoFoco && document.contains(ultimoFoco)) {
      try { ultimoFoco.focus({ preventScroll: true }); } catch (_) { /* sem foco */ }
    }
  }

  /* Arrastar a folha para baixo fecha, como numa folha nativa. */
  var y0 = null, dy = 0, arrastando = false;
  folha.addEventListener('touchstart', function (e) {
    y0 = folha.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; arrastando = false;
  }, { passive: true });
  folha.addEventListener('touchmove', function (e) {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (!arrastando) {
      if (dy > 6 && folha.scrollTop <= 0) { arrastando = true; folha.style.transition = 'none'; }
      else { if (dy < -6) y0 = null; return; }
    }
    e.preventDefault();
    folha.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
  }, { passive: false });
  folha.addEventListener('touchend', function () {
    if (arrastando) {
      folha.style.transition = '';
      if (dy > 110) fechar(); else folha.style.transform = '';
    }
    arrastando = false; y0 = null;
  });

  /* ───────── Desenho e eventos ───────── */

  function desenhar() {
    tela.innerHTML = estado.aba === 'objetivo' ? telaObjetivo() : telaTreino();
    var abas = document.querySelectorAll('.aba');
    for (var i = 0; i < abas.length; i++) {
      if (abas[i].dataset.aba === estado.aba) abas[i].setAttribute('aria-current', 'page');
      else abas[i].removeAttribute('aria-current');
    }
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.dataset.aba) {
      if (estado.aba !== b.dataset.aba) { estado.aba = b.dataset.aba; desenhar(); }
      window.scrollTo(0, 0);
    } else if (b.dataset.dow !== undefined) {
      estado.dow = +b.dataset.dow; desenhar();
      var alvo = tela.querySelector('.dia[aria-pressed="true"]');
      if (alvo) { try { alvo.focus({ preventScroll: true }); } catch (_) { /* sem foco */ } }
    } else if (b.dataset.ir !== undefined) {
      estado.dow = +b.dataset.ir; desenhar(); window.scrollTo(0, 0);
    } else if (b.classList.contains('item')) {
      var t = PLANO.treinos[b.dataset.treino];
      abrir(folhaItem(t, t.blocos[+b.dataset.b].slots[+b.dataset.s]));
    } else if (b.dataset.fase) {
      var o = PLANO.objetivos.filter(function (x) { return x.id === b.dataset.fase; })[0];
      if (o) abrir(folhaFase(o));
    } else if (b.classList.contains('fechar')) {
      fechar();
    }
  });
  fundo.addEventListener('click', fechar);
  document.addEventListener('keydown', function (e) {
    if (folha.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); fechar(); }
    else if (e.key === 'Tab') { e.preventDefault(); $('.fechar', folha).focus(); }
  });

  /* O app fica aberto por dias na tela de início: confere a data ao voltar. */
  function conferirData() {
    var agora = meiaNoite(new Date());
    if (+agora === +estado.hoje) return;
    var estavaHoje = estado.dow === estado.hoje.getDay();
    estado.hoje = agora;
    if (estavaHoje) estado.dow = agora.getDay();
    if (folha.hidden) desenhar();
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) conferirData(); });
  window.addEventListener('pageshow', conferirData);
  setInterval(conferirData, 60000);

  desenhar();

  /* Offline e atualização. Fora de http(s), ou num quadro isolado, simplesmente não registra. */
  try {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      var aviso = $('.aviso');
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (e.data && e.data.tipo === 'versao-nova') aviso.hidden = false;
      });
      $('button', aviso).addEventListener('click', function () { location.reload(); });
      var perguntar = function () {
        var w = navigator.serviceWorker.controller;
        if (w) w.postMessage({ tipo: 'ha-novidade' });
      };
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () { /* segue sem offline */ });
        perguntar();
        setTimeout(perguntar, 4000);
      });
    }
  } catch (_) { /* segue sem offline */ }
})();
</script>
</body>
</html>
