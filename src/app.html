<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phoda 40+</title>
<meta name="description" content="App Treino Phoda 40+: treinos da semana e objetivo atual.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1E26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phoda 40+">
<style>
/* Cores: mar fundo, areia como tinta, céu só para “agora”.
   Verde, amarelo e vermelho aparecem apenas na leitura do joelho. */
:root{
  color-scheme:dark;
  --mar:#0E1E26;
  --mare:#16313C;
  --areia:#EADFC8;
  --areia-2:#A69C87;
  --linha:rgba(234,223,200,.15);
  --linha-forte:rgba(234,223,200,.34);
  --toque:rgba(234,223,200,.07);
  --ceu:#8FD3FF;
  --verde:#37C77F;
  --amarelo:#F3C544;
  --vermelho:#EE5B4F;
  --min:20px;            /* a régua: 1 minuto = 20 px */
  --lombada:24px;
  --trilho:42px;
  --tab-h:58px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --f-num:"Big Shoulders","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-txt:"Libre Franklin",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--mar);-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:var(--sat)}
body{
  margin:0;min-height:100dvh;background:var(--mar);color:var(--areia);
  font:400 16px/1.45 var(--f-txt);-webkit-font-smoothing:antialiased;
  padding-top:var(--sat);overscroll-behavior-y:none;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:var(--sat);z-index:20;
  background:rgba(14,30,38,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
html.travado,html.travado body{overflow:hidden}
h1,h2,h3,p,ol,ul,dl,dd{margin:0;padding:0}
ol,ul{list-style:none}
button{
  font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ceu);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-optical-sizing:auto}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

#app{max-width:520px;margin:0 auto;padding:0 16px calc(var(--tab-h) + var(--sab) + 36px)}

/* Cabeçalho e semana */
.topo{padding-top:14px}
.linha-data{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;color:var(--areia-2)}
.linha-data .hoje{color:var(--ceu);font-weight:600}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.dia{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  height:66px;border-radius:14px;
}
.dia .dow{font-size:12px;line-height:1;color:var(--areia-2)}
.dia .cod{font:700 26px/1 var(--f-num)}
.dia.folga .cod{font-weight:400;color:var(--areia-2)}
.dia:active{background:var(--toque)}
.dia[aria-pressed="true"]{background:var(--areia);color:var(--mar)}
.dia[aria-pressed="true"] .dow,.dia[aria-pressed="true"].folga .cod{color:rgba(14,30,38,.66)}
.dia.e-hoje::after{
  content:"";position:absolute;left:50%;bottom:-9px;width:6px;height:6px;margin-left:-3px;
  border-radius:50%;background:var(--ceu);
}

/* Título do treino */
.cab{display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:12px;margin-top:34px}
.cab h1{font:800 62px/.88 var(--f-num)}
.cab .total{font:300 62px/.88 var(--f-num);white-space:nowrap}
.cab .total small{font:500 15px/1 var(--f-txt);color:var(--areia-2);margin-left:5px}
.sub{margin-top:12px;font-size:18px;font-weight:600;line-height:1.3}
.contexto{margin-top:4px;font-size:14.5px;color:var(--areia-2)}

/* A régua de minutos */
.regua{margin-top:22px}
.bloco{display:grid;grid-template-columns:var(--lombada) 1fr}
.lombada{
  border-top:1px solid var(--mar);
  background:repeating-linear-gradient(135deg,var(--linha) 0 1px,transparent 1px 7px);
  box-shadow:inset 0 0 0 1px var(--linha);color:var(--areia-2);
}
.bloco.nucleo .lombada{background:var(--areia);box-shadow:none;color:var(--mar)}
.lombada span{
  position:sticky;top:calc(var(--sat) + 8px);
  display:block;width:var(--lombada);padding:9px 0;
  writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:11.5px;font-weight:700;line-height:var(--lombada);letter-spacing:.02em;white-space:nowrap;text-align:end;
}
.bloco:not(.nucleo) .lombada span{background:var(--mar);box-shadow:inset 1px 0 0 var(--linha),inset -1px 0 0 var(--linha)}
.item{
  position:relative;display:grid;grid-template-columns:var(--trilho) minmax(0,1fr) auto;column-gap:10px;align-content:start;
  width:100%;min-height:max(44px,calc(var(--m) * var(--min)));
  border-top:1px solid var(--linha-forte);
}
.item::before{
  content:"";position:absolute;left:0;top:-1px;bottom:0;width:8px;
  background:repeating-linear-gradient(to bottom,var(--linha-forte) 0 1px,transparent 1px var(--min));
}
.item:active{background:var(--toque)}
.item .t{justify-self:start;padding:9px 0 0 16px;font:600 17px/1 var(--f-num);color:var(--areia-2)}
.item .corpo{display:block;min-width:0;padding:8px 0}
.item .nome{display:block;font-size:17px;font-weight:600;line-height:1.24}
.item .dica{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--l);line-clamp:var(--l);overflow:hidden;
  margin-top:6px;font-size:13.5px;line-height:1.42;color:var(--areia-2);
}
.item .dose{padding:6px 2px 6px 0;text-align:right;font:700 30px/1 var(--f-num);white-space:nowrap}
.item .dose span{display:block}
.item .dose i{margin-left:4px;font:500 13px/1 var(--f-txt);color:var(--areia-2)}
.item .dose.varias{font-size:23px;line-height:1.06;padding-top:8px;padding-bottom:4px}
.item .dose.tres{font-size:21px;line-height:1.05}
.item .dose small{display:block;margin-top:4px;font:500 12px/1 var(--f-txt);color:var(--areia-2)}
.fim{
  display:grid;grid-template-columns:var(--lombada) var(--trilho) 1fr;column-gap:0;
  border-top:1px solid var(--linha-forte);color:var(--areia-2);font-size:14px;
}
.fim .t{justify-self:start;padding:9px 0 0 16px;font:600 17px/1 var(--f-num)}
.fim .txt{padding:8px 0 0 10px}
.toque{margin:22px 0 0 calc(var(--lombada) + var(--trilho) + 10px);font-size:13.5px;line-height:1.42;color:var(--areia-2)}

/* Quinta e descanso */
.avulso{margin-top:34px}
.avulso h1{font:800 62px/.88 var(--f-num)}
.avulso .hora{margin-top:34px;font:300 132px/.8 var(--f-num);letter-spacing:-.01em}
.avulso .hora small{display:block;margin-top:14px;font:500 15px/1.3 var(--f-txt);letter-spacing:0;color:var(--areia-2)}
.notas{margin-top:28px;border-bottom:1px solid var(--linha)}
.notas li{padding:14px 0;border-top:1px solid var(--linha);font-size:16px}
.proximo{
  display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:28px;padding:16px 18px;
  border-radius:16px;background:var(--areia);color:var(--mar);font-weight:600;
}
.proximo .num{font-size:30px;font-weight:800;line-height:1}
.proximo:active{opacity:.86}

/* Objetivo */
.agora{margin-top:22px}
.agora .rot{font-size:15px;font-weight:600;color:var(--ceu)}
.agora h1{margin-top:6px;font:800 52px/.92 var(--f-num)}
.agora h1 + h1{margin-top:8px}
.agora .resumo{margin-top:14px;font-size:16px;color:var(--areia-2)}
.tempo{position:relative;margin-top:34px}
.eixo{position:relative;height:36px;border-bottom:1px solid var(--linha-forte)}
.eixo .mes{position:absolute;bottom:6px;font-size:12px;line-height:1;color:var(--areia-2);transform:translateX(3px)}
.eixo .mes::before{content:"";position:absolute;left:-3px;bottom:-6px;width:1px;height:16px;background:var(--linha-forte)}
.eixo .ano{position:absolute;top:0;font:600 13px/1 var(--f-num);color:var(--areia-2);transform:translateX(3px)}
.eixo .aqui{position:absolute;top:0;font-size:12px;line-height:1;font-weight:600;color:var(--ceu);transform:translateX(-50%);white-space:nowrap}
.eixo .aqui.esq{transform:none}
.eixo .aqui.dir{transform:translateX(-100%)}
.fase{display:block;width:100%;padding:14px 0 15px;border-bottom:1px solid var(--linha)}
.fase:active{background:var(--toque)}
.fase .f-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fase .f-nome{font-size:17px;font-weight:600}
.fase .f-datas{font:600 17px/1 var(--f-num);color:var(--areia-2);white-space:nowrap}
.fase .trilha{position:relative;display:block;height:14px;margin-top:11px}
.fase .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--linha)}
.fase .barra{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--areia);overflow:hidden}
.fase.feito .barra{opacity:.42}
.fase.agora-f .barra{background:rgba(234,223,200,.2);box-shadow:inset 0 0 0 1px var(--areia)}
.fase.agora-f .cheio{position:absolute;left:0;top:0;bottom:0;background:var(--areia)}
.fase.futuro .barra{background:repeating-linear-gradient(135deg,var(--areia) 0 1.5px,transparent 1.5px 6px);box-shadow:inset 0 0 0 1px var(--linha-forte)}
.fase.aberta .barra{
  background:repeating-linear-gradient(135deg,var(--areia-2) 0 1px,transparent 1px 6px);
  -webkit-mask-image:linear-gradient(to right,#000,transparent);mask-image:linear-gradient(to right,#000,transparent);border-radius:3px 0 0 3px;
}
.fase .marco{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--mar)}
.fase .agulha{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ceu)}
.fase .f-estado{display:block;margin-top:10px;font-size:14px;color:var(--areia-2)}
.fase.agora-f .f-estado{color:var(--areia)}
.fase .f-crit{display:block;margin-top:4px;font-size:14px;line-height:1.42;color:var(--areia-2)}

.semaforo{margin-top:38px}
.semaforo h2{font-size:17px;font-weight:600}
.semaforo ol{margin-top:10px;border-bottom:1px solid var(--linha)}
.semaforo li{display:grid;grid-template-columns:12px 46px 1fr;column-gap:10px;align-items:baseline;padding:13px 0;border-top:1px solid var(--linha)}
.semaforo .luz{align-self:start;margin-top:6px;width:12px;height:12px;border-radius:50%}
.luz.verde{background:var(--verde)}.luz.amarelo{background:var(--amarelo)}.luz.vermelho{background:var(--vermelho)}
.semaforo .faixa{font:700 24px/1 var(--f-num)}
.semaforo .s-txt{font-size:14.5px;line-height:1.42;color:var(--areia-2)}
.semaforo .s-txt b{color:var(--areia);font-weight:600}

/* Barra inferior */
.abas{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(14,30,38,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--linha);padding-bottom:var(--sab);
}
.abas div{display:grid;grid-template-columns:1fr 1fr;max-width:520px;margin:0 auto;padding:0 16px}
.aba{display:flex;align-items:center;justify-content:center;gap:9px;height:var(--tab-h);font-size:15px;font-weight:600;color:var(--areia-2)}
.aba svg{width:22px;height:22px;flex:none}
.aba[aria-current="page"]{color:var(--areia)}
.aba:active{opacity:.7}

/* Folha de detalhe */
.fundo{position:fixed;inset:0;z-index:40;background:rgba(3,10,14,.62);opacity:0;transition:opacity .22s ease}
.fundo.on{opacity:1}
.folha{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;max-height:88dvh;overflow-y:auto;
  background:var(--mare);border-radius:24px 24px 0 0;padding:0 20px calc(var(--sab) + 30px);
  transform:translateY(103%);transition:transform .3s cubic-bezier(.2,.85,.25,1);
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.folha.on{transform:none}
.folha .pega{position:sticky;top:0;z-index:1;display:flex;justify-content:center;align-items:flex-start;height:30px;margin:0 -20px;background:var(--mare);border-radius:24px 24px 0 0;touch-action:none}
.folha .pega::before{content:"";width:40px;height:4px;margin-top:10px;border-radius:2px;background:var(--linha-forte)}
.folha .fechar{position:absolute;right:8px;top:8px;z-index:2;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--areia-2)}
.folha .fechar:active{background:var(--toque)}
.folha .fechar svg{width:18px;height:18px}
.folha h2{padding-right:40px;font:800 38px/.95 var(--f-num)}
.folha .onde{margin-top:8px;font-size:14.5px;color:var(--areia-2)}
.folha .unica{margin-top:20px;font:800 64px/.9 var(--f-num)}
.folha .unica i,.folha .doses dd i{margin-left:6px;font:500 15px/1 var(--f-txt);color:var(--areia-2)}
.folha .unica small{display:block;margin-top:8px;font:500 15px/1 var(--f-txt);color:var(--areia-2)}
.folha .doses{margin-top:18px;border-bottom:1px solid var(--linha)}
.folha .doses div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--linha)}
.folha .doses dt{font-size:16px}
.folha .doses dd{font:700 30px/1 var(--f-num);white-space:nowrap}
.folha .regra{margin-top:20px;padding:13px 15px;border-radius:14px;background:rgba(234,223,200,.09);font-size:15.5px;font-weight:500;line-height:1.4}
.folha h3{margin-top:24px;font-size:14px;font-weight:600;color:var(--areia-2)}
.folha h3 + p{margin-top:5px;font-size:16.5px;line-height:1.5}
.folha .corrido{margin-top:16px;font-size:16.5px;line-height:1.5}
.escada{margin-top:8px;border-bottom:1px solid var(--linha)}
.escada li{display:grid;grid-template-columns:26px 1fr;column-gap:8px;align-items:baseline;padding:12px 0;border-top:1px solid var(--linha)}
.escada .n{font:700 24px/1 var(--f-num);color:var(--areia-2)}
.escada .e-nome{display:block;font-size:16px;font-weight:500;line-height:1.3}
.escada .e-data{display:block;margin-top:3px;font-size:13.5px;color:var(--areia-2)}
.escada li.atual .n{color:var(--areia)}
.escada li.atual .e-data{color:var(--ceu);font-weight:600}
.miudo{margin-top:10px;font-size:13.5px;line-height:1.42;color:var(--areia-2)}

/* Aviso de versão nova */
.aviso{
  position:fixed;left:16px;right:16px;bottom:calc(var(--tab-h) + var(--sab) + 12px);z-index:35;max-width:488px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 10px 10px 16px;
  border-radius:16px;background:var(--mare);box-shadow:0 0 0 1px var(--linha-forte),0 10px 30px rgba(0,0,0,.4);font-size:15px;
}
.aviso button{padding:9px 14px;border-radius:11px;background:var(--areia);color:var(--mar);font-weight:600}

@media (prefers-reduced-motion:reduce){
  .fundo,.folha{transition:none}
}
@media (min-width:600px){
  .folha{border-radius:24px;bottom:24px}
}
</style>
<style id="fontes">
/* Big Shoulders e Libre Franklin, licença SIL OFL 1.1, embutidas para o app abrir igual sem rede. */
@font-face{font-family:"Big Shoulders";font-style:normal;font-weight:100 900;font-display:swap;src:url(data:font/woff2;base64,__FONTE_NUM__) format("woff2")}
@font-face{font-family:"Libre Franklin";font-style:normal;font-weight:100 900;font-display:swap;src:url(data:font/woff2;base64,__FONTE_TXT__) format("woff2")}
</style>
</head>
<body>
<div id="app"><main id="tela"></main></div>

<nav class="abas" aria-label="Seções">
  <div>
    <button class="aba" data-aba="treino" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 3v18M9 5h10M9 9.67h5M9 14.33h10M9 19h5"/></svg>
      Treino
    </button>
    <button class="aba" data-aba="objetivo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7h9M8 12h11M5 17h7M15 3v18"/></svg>
      Objetivo
    </button>
  </div>
</nav>

<div class="fundo" hidden></div>
<section class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo" tabindex="-1" hidden>
  <div class="pega" aria-hidden="true"></div>
  <button class="fechar" aria-label="Fechar">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15"/></svg>
  </button>
  <div class="conteudo"></div>
</section>

<div class="aviso" role="status" hidden>
  <span>Tem versão nova do plano.</span>
  <button type="button">Atualizar</button>
</div>

<script>
__PLANO__
</script>
<script>
__APP__
</script>
</body>
</html>
